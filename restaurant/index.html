<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Basil &amp; Bloom</title>
  <meta name="description" content="Order brunch, fresh bowls, ramen, grill plates, desserts and drinks from Basil &amp; Bloom. Dine in, pick up or get it delivered." />
  <meta name="theme-color" content="#efe3de" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151110" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- Soft pastel light behind the glass -->
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="app">
    <div class="main" id="main">
      <div class="main__scroll" id="mainScroll">
        <header class="topbar" id="topbar">
          <button class="iconbtn" type="button" data-action="open-info" aria-label="Restaurant info and hours"><span data-icon="menu"></span></button>
          <a class="brand" href="#/menu"><span class="logo logo-slot"></span><span class="brand__name">Basil &amp; Bloom</span></a>
          <button class="iconbtn" type="button" data-action="toggle-search" aria-label="Search the menu" aria-expanded="false"><span data-icon="search"></span></button>
          <span class="topbar__cart-space" aria-hidden="true"></span>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>

      <a class="cartbtn" id="cartBtn" href="#/cart" aria-label="Cart"><span data-icon="cart"></span><span class="cartbtn__badge" data-cart-count hidden>0</span></a>

      <nav class="tabbar" id="tabbar" aria-label="Main">
        <a class="tab" href="#/menu" data-tab="menu"><span data-icon="home"></span><span class="tab__label">Menu</span></a>
        <a class="tab" href="#/favorites" data-tab="favorites"><span data-icon="heart"></span><span class="tab__label">Favorites</span></a>
        <a class="tab" href="#/orders" data-tab="orders"><span data-icon="receipt"></span><span class="tab__label">Orders</span><span class="tab__dot" hidden></span></a>
        <a class="tab" href="#/profile" data-tab="profile"><span data-icon="user"></span><span class="tab__label">Profile</span></a>
      </nav>
    </div>

    <aside class="side" id="side" aria-label="Your order">
      <div class="side__inner" id="sideInner"></div>
    </aside>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-action="close-info"></div>
    <div class="drawer__panel" id="drawerPanel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Online ordering needs JavaScript. You can still order by phone on +1 (555) 014-2710.</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
