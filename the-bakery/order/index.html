<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Order · The Bakery</title>
  <meta name="description" content="Order croissants, cookies, pretzels, loaves and drinks from The Bakery for pickup or delivery. A brand concept by Kreeative." />
  <meta name="theme-color" content="#fefadc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#22101a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Order · The Bakery" />
  <meta property="og:description" content="Croissants, cookies, pretzels and loaves for pickup or delivery. A brand concept by Kreeative." />
  <meta property="og:image" content="https://the-bakery-concept.vercel.app/assets/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" href="../assets/fonts/big-shoulders-display-900.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../assets/fonts/outfit-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- Cream ground with the brand's hand-drawn pattern, faint -->
  <div class="backdrop" aria-hidden="true"></div>

  <div class="app">
    <div class="main" id="main">
      <div class="main__scroll" id="mainScroll">
        <header class="topbar" id="topbar">
          <button class="iconbtn" type="button" data-action="open-info" aria-label="Bakery info and hours"><span data-icon="menu"></span></button>
          <a class="brand" href="#/menu"><span class="wordmark" role="img" aria-label="The Bakery"></span></a>
          <button class="iconbtn" type="button" data-action="toggle-search" aria-label="Search the menu" aria-expanded="false"><span data-icon="search"></span></button>
          <span class="topbar__cart-space" aria-hidden="true"></span>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>

      <a class="cartbtn" id="cartBtn" href="#/cart" aria-label="Your bag"><span data-icon="bag"></span><span class="cartbtn__badge" data-cart-count hidden>0</span></a>

      <nav class="tabbar" id="tabbar" aria-label="Main">
        <a class="tab" href="#/menu" data-tab="menu"><span data-icon="home"></span><span class="tab__label">Menu</span></a>
        <a class="tab" href="#/favorites" data-tab="favorites"><span data-icon="heart"></span><span class="tab__label">Favorites</span></a>
        <a class="tab" href="#/orders" data-tab="orders"><span data-icon="receipt"></span><span class="tab__label">Orders</span><span class="tab__dot" hidden></span></a>
        <a class="tab" href="#/profile" data-tab="profile"><span data-icon="user"></span><span class="tab__label">Profile</span></a>
      </nav>
    </div>

    <aside class="side" id="side" aria-label="Your order">
      <div class="side__inner" id="sideInner"></div>
    </aside>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-action="close-info"></div>
    <div class="drawer__panel" id="drawerPanel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Ordering online needs JavaScript. The Bakery is a brand concept by Kreeative, so there is no shop to call: <a href="../">see the brand</a>.</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
