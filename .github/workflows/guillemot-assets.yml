name: Guillemot assets

# Fetches the free-licence photos (Pexels) and the web fonts for guillemot/.
# The development sandbox cannot reach photo sites or font CDNs; see guillemot/tools/fetch.py.
on:
  push:
    branches: ["claude/restaurant-food-ordering-app-2jft1i"]
    paths:
      - "guillemot/tools/sources.json"
      - "guillemot/tools/picks.json"
      - "guillemot/tools/fonts.json"
      - "guillemot/tools/fetch.py"

permissions:
  contents: write

concurrency:
  group: guillemot-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Fetch photos and fonts
        run: python guillemot/tools/fetch.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guillemot/tools guillemot/assets
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Fetch Guillemot photos and fonts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
