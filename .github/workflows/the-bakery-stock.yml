name: The Bakery stock doodles

# One-off: renders a licensed Adobe Stock vector to PNG and traces it to SVG,
# for the-bakery/. The sandbox cannot reach Adobe Stock downloads.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Licensed download link (expires within the hour)"
        required: true
      name:
        description: "File name to save under the-bakery/tools/stock/"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/restaurant-food-ordering-app-2jft1i

      - name: Hide the download link in logs
        run: echo "::add-mask::${{ inputs.url }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript potrace
          pip install pillow

      - name: Render and trace
        env:
          STOCK_URL: ${{ inputs.url }}
          STOCK_NAME: ${{ inputs.name }}
        run: python the-bakery/tools/stock.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bakery/tools/stock
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Render the ${{ inputs.name }} stock doodles"
          git pull --rebase origin claude/restaurant-food-ordering-app-2jft1i
          git push origin HEAD:claude/restaurant-food-ordering-app-2jft1i
