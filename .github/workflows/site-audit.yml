# One-off: check a prospect's public website (DNS, HTTPS, pages, images)
# from a runner with open internet, and print a report to the job log.
# Removed once the report is read.
name: Site audit

on:
  push:
    branches: [claude/restaurant-food-ordering-app-2jft1i]
    paths: [".github/workflows/site-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOMAIN: kaeracosmetic.com
    steps:
      - name: DNS and registration
        run: |
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
          for d in "$DOMAIN" "www.$DOMAIN"; do
            echo "== $d"
            echo "A:     $(dig +short A "$d" | tr '\n' ' ')"
            echo "CNAME: $(dig +short CNAME "$d" | tr '\n' ' ')"
            echo "status: $(dig "$d" A | grep -o 'status: [A-Z]*')"
          done
          echo "NS:  $(dig +short NS "$DOMAIN" | tr '\n' ' ')"
          echo "SOA: $(dig +short SOA "$DOMAIN")"
          echo "== WHOIS"
          whois "$DOMAIN" | grep -i -E 'Registry Expiry|Expiration Date|Expiry Date|Updated Date|Creation Date|Registrar:|Name Server|Domain Status|No match' | head -20 || true

      - name: HTTP entry points
        run: |
          for u in "https://www.$DOMAIN/" "https://$DOMAIN/" "http://www.$DOMAIN/" "http://$DOMAIN/"; do
            curl -sS -L -o /dev/null --max-time 30 \
              -w "$u -> %{http_code} %{url_effective} %{time_total}s %{size_download}B\n" "$u" || echo "$u -> failed"
          done
          echo "== TLS certificate"
          echo | timeout 15 openssl s_client -servername "www.$DOMAIN" -connect "www.$DOMAIN:443" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "no certificate"

      - name: Crawl
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, time, html as H
          from urllib.parse import urljoin, urlparse
          D = os.environ["DOMAIN"]
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          def get(u, keep=True, t=30):
              r = subprocess.run(["curl", "-sSL", "-A", UA, "--max-time", str(t), "-o", "/tmp/b", "-w",
                                  "%{http_code} %{url_effective} %{size_download} %{time_total}", u], capture_output=True, text=True)
              p = (r.stdout.split(" ") + [""] * 4)[:4]
              try:
                  s = open("/tmp/b", encoding="utf-8", errors="replace").read() if keep else ""
              except Exception:
                  s = ""
              return p, s
          def text(s):
              s = re.sub(r"<(script|style|noscript)[^>]*>.*?</\1>", " ", s, flags=re.S | re.I)
              return H.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s))).strip()
          base = None
          for u in ["https://www." + D + "/", "https://" + D + "/", "http://www." + D + "/"]:
              p, s = get(u)
              if p[0] == "200" and len(s) > 500:
                  base, home = p[1], s
                  break
          if not base:
              print("SITE UNREACHABLE: no entry point answered 200")
              raise SystemExit(0)
          print("BASE", base)
          print("TITLE", re.findall(r"<title>([^<]*)", home)[:1])
          print("DESCRIPTION", re.findall(r'<meta name="description" content="([^"]*)', home)[:1])
          print("GENERATOR", re.findall(r'<meta name="generator" content="([^"]*)', home)[:2])
          print("VIEWPORT", re.findall(r'<meta name="viewport" content="([^"]*)', home)[:1])
          print("LANG", re.findall(r"<html[^>]*lang=\"([^\"]*)", home)[:1])
          print("OG", re.findall(r'property="og:(?:title|image)" content="([^"]*)', home)[:2])
          t = text(home).lower()
          print("HOME WORDS", {k: t.count(k) for k in ["panier", "ajouter au panier", "acheter", "commander", "prix", "fcfa", "€", "livraison", "whatsapp", "boutique", "points de vente", "france", "diaspora", "jumia", "covid"]})
          print("HOME TEXT", t[:900])
          links = []
          for h in re.findall(r'href="([^"#]+)"', home):
              u = urljoin(base, h.strip())
              if u not in links:
                  links.append(u)
          internal = [u for u in links if urlparse(u).netloc.endswith(D) and not re.search(r"\.(css|js|png|jpe?g|webp|svg|ico|woff2?|pdf)(\?|$)", u)]
          external = [u for u in links if u.startswith("http") and not urlparse(u).netloc.endswith(D)]
          print("NAV/INTERNAL", len(internal))
          for u in internal[:60]:
              print("  ", u)
          print("EXTERNAL", len(external))
          for u in external[:30]:
              p, _ = get(u, False, 20)
              print("  ", p[0], u)
              time.sleep(0.5)
          # Crawl internal pages, breadth first, politely
          seen, queue, pages = set(), list(internal), []
          while queue and len(pages) < 70:
              u = queue.pop(0)
              if u in seen:
                  continue
              seen.add(u)
              time.sleep(0.6)
              p, s = get(u)
              tt = text(s)
              pages.append((u, p, tt))
              flags = []
              if p[0] != "200": flags.append("HTTP " + p[0])
              if re.search(r"lorem ipsum", tt, re.I): flags.append("LOREM")
              if len(tt) < 400: flags.append("THIN %d chars" % len(tt))
              if re.search(r"\b(fcfa|€|prix)\b", tt, re.I): flags.append("PRICE")
              if re.search(r"panier|ajouter au panier|checkout", tt, re.I): flags.append("CART")
              print("PAGE", p[0], p[3] + "s", u, "|", ", ".join(flags))
              for h in re.findall(r'href="([^"#]+)"', s):
                  v = urljoin(u, h.strip())
                  if urlparse(v).netloc.endswith(D) and v not in seen and v not in queue and not re.search(r"\.(css|js|png|jpe?g|webp|svg|ico|woff2?|pdf)(\?|$)", v):
                      queue.append(v)
          print("PAGES CRAWLED", len(pages), "| left in queue", len(queue))
          # Points of sale and countries
          for u, p, tt in pages:
              if "points_de_vente" in u and "pays=" not in u:
                  print("POINTS DE VENTE TEXT", tt[:1200])
          # Images on the home page
          imgs = []
          for i in re.findall(r'<img[^>]+?(?:data-src|src)="([^"]+)"', home) + re.findall(r"url\(['\"]?([^)'\"]+\.(?:jpe?g|png|webp|gif))", home):
              v = urljoin(base, i)
              if v not in imgs:
                  imgs.append(v)
          total = 0
          for v in imgs:
              p, _ = get(v, False, 40)
              try:
                  sz = int(float(p[2] or 0))
              except Exception:
                  sz = 0
              total += sz
              if p[0] != "200" or sz > 300000:
                  print("  IMG", p[0], round(sz / 1024), "KB", v)
              time.sleep(0.2)
          print("HOME IMAGES", len(imgs), "TOTAL MB %.1f" % (total / 1048576))
          EOF

      - name: Kaera on marketplaces
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in "https://www.jumia.ci/catalog/?q=kaera" "https://www.jumia.sn/kaera-cosmetics/" "https://www.jumia.co.ke/skin-care-creams/kaera/"; do
            code=$(curl -sS -L -A "$UA" --max-time 30 -o page.html -w "%{http_code}" "$u" || echo 000)
            n=$(grep -o -i 'kaera' page.html 2>/dev/null | wc -l)
            prods=$(grep -o -i 'class="prd _fb' page.html 2>/dev/null | wc -l)
            echo "$u -> $code | 'kaera' mentions: $n | product cards: $prods"
            sleep 1
          done
