# One-off: check a prospect's public website (DNS, HTTPS, pages, images)
# from a runner with open internet, and print a report to the job log.
# Removed once the report is read.
name: Site audit

on:
  push:
    branches: [claude/restaurant-food-ordering-app-2jft1i]
    paths: [".github/workflows/site-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOMAIN: heredita.fr
    steps:
      - name: DNS and registration
        run: |
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
          for d in "$DOMAIN" "www.$DOMAIN"; do
            echo "== $d  A: $(dig +short A "$d" | tr '\n' ' ') CNAME: $(dig +short CNAME "$d" | tr '\n' ' ')"
          done
          echo "NS: $(dig +short NS "$DOMAIN" | tr '\n' ' ')"
          whois "$DOMAIN" | grep -i -E 'created|Expiry|expir|registrar:|status' | head -8 || true

      - name: HTTP entry points
        run: |
          for u in "https://$DOMAIN/" "https://$DOMAIN/fr" "https://www.$DOMAIN/" "http://$DOMAIN/"; do
            curl -sS -L -o /dev/null --max-time 30 \
              -w "$u -> %{http_code} %{url_effective} %{time_total}s %{size_download}B\n" "$u" || echo "$u -> failed"
          done
          echo "== Mapstr website link"
          curl -sS -L --max-time 30 -o m.html -w "http://enpleinair.dazavola.com -> %{http_code} %{url_effective}\n" "http://enpleinair.dazavola.com" || true
          grep -o -i -m1 '<title>[^<]*' m.html || true
          sed -e 's/<[^>]*>/ /g' m.html | tr -s ' \n' ' ' | head -c 600; echo

      - name: Crawl
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, time, html as H
          from urllib.parse import urljoin, urlparse
          D = os.environ["DOMAIN"]
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          def get(u, keep=True, t=30):
              r = subprocess.run(["curl", "-sSL", "-A", UA, "--max-time", str(t), "-o", "/tmp/b", "-w",
                                  "%{http_code} %{url_effective} %{size_download} %{time_total}", u], capture_output=True, text=True)
              p = (r.stdout.split(" ") + [""] * 4)[:4]
              try:
                  s = open("/tmp/b", encoding="utf-8", errors="replace").read() if keep else ""
              except Exception:
                  s = ""
              return p, s
          def visible(s):
              s = re.sub(r"<!--.*?-->", " ", s, flags=re.S)
              return re.sub(r"<(script|style|noscript)[^>]*>.*?</\1>", " ", s, flags=re.S | re.I)
          def text(s):
              return H.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", visible(s)))).strip()
          base = None
          for u in ["https://" + D + "/fr", "https://" + D + "/", "https://www." + D + "/"]:
              p, s = get(u)
              if p[0] == "200" and len(s) > 300:
                  base, home = p[1], s
                  break
          if not base:
              print("SITE UNREACHABLE")
              raise SystemExit(0)
          print("BASE", base, "| bytes", len(home))
          print("TITLE", re.findall(r"<title>([^<]*)", home)[:1])
          print("DESCRIPTION", re.findall(r'<meta name="description" content="([^"]*)', home)[:1])
          print("GENERATOR", re.findall(r'<meta name="generator" content="([^"]*)', home)[:2])
          print("VIEWPORT", re.findall(r'<meta name="viewport" content="([^"]*)', home)[:1])
          print("OG", re.findall(r'property="og:(?:title|image|description)" content="([^"]*)', home)[:3])
          print("SCHEMA.ORG", re.findall(r'"@type"\s*:\s*"([^"]+)"', home)[:6])
          print("PLATFORM HINTS", sorted(set(m.lower() for m in re.findall(r"(wix|squarespace|wordpress|wp-content|shopify|webflow|framer|zenchef|thefork|lafourchette|sevenrooms|guestonline|resy|ubereats|uber eats|deliveroo|just ?eat|google\.com/maps|maps\.app|calendly|linktr\.ee|carrd|jimdo|weebly|godaddy|hostinger|site123|bentobox|popmenu|dazavola)", home, re.I))))
          t = text(home)
          tl = t.lower()
          print("WORDS", {k: tl.count(k) for k in ["menu", "carte", "réserv", "commander", "livraison", "uber", "deliveroo", "click", "halal", "brunch", "pizza", "horaires", "lundi", "122", "romainville", "©", "lorem"]})
          print("VISIBLE TEXT", t[:1500])
          print("FOOTER", t[-500:])
          links = []
          for h in re.findall(r'href="([^"#]+)"', visible(home)):
              u = urljoin(base, h.strip())
              if u not in links:
                  links.append(u)
          print("LINKS", len(links))
          for u in links[:60]:
              if u.startswith("http") and not re.search(r"\.(css|js|woff2?|ico)(\?|$)", u):
                  p, _ = get(u, False, 20)
                  print("  ", p[0], u)
                  time.sleep(0.4)
          imgs = []
          for i in re.findall(r'<img[^>]+?(?:data-src|src)="([^"]+)"', visible(home)) + re.findall(r"url\(['\"]?([^)'\"]+\.(?:jpe?g|png|webp|gif))", home):
              v = urljoin(base, i)
              if v not in imgs and not v.startswith("data:"):
                  imgs.append(v)
          total = 0
          for v in imgs[:80]:
              p, _ = get(v, False, 40)
              try:
                  sz = int(float(p[2] or 0))
              except Exception:
                  sz = 0
              total += sz
              if p[0] != "200" or sz > 300000:
                  print("  IMG", p[0], round(sz / 1024), "KB", v)
              time.sleep(0.2)
          print("IMAGES", len(imgs), "TOTAL MB %.1f" % (total / 1048576))
          # Other pages on the same site
          internal = [u for u in links if urlparse(u).netloc.endswith(D) and not re.search(r"\.(css|js|png|jpe?g|webp|svg|ico|woff2?|pdf)(\?|$)", u)]
          for u in internal[:25]:
              if u.rstrip("/") == base.rstrip("/"):
                  continue
              time.sleep(0.6)
              p, s = get(u)
              tt = text(s)
              print("PAGE", p[0], p[3] + "s", u, "| chars", len(tt), "|", tt[:220].replace("\n", " "))
          EOF
