name: The Bakery assets

# Traces the brand artwork, fetches web fonts and free-licence photos (Pexels,
# Openverse) and cuts the photos out, for the-bakery/. The development sandbox
# cannot reach those hosts; see the-bakery/tools/fetch.py.
on:
  push:
    branches: ["claude/restaurant-food-ordering-app-2jft1i"]
    paths:
      - "the-bakery/tools/sources.json"
      - "the-bakery/tools/picks.json"
      - "the-bakery/tools/fonts.json"
      - "the-bakery/tools/marks.json"
      - "the-bakery/tools/fetch.py"

permissions:
  contents: write

concurrency:
  group: the-bakery-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq potrace
          pip install pillow numpy
          if [ -f the-bakery/tools/picks.json ]; then pip install "rembg[cpu]"; fi

      - name: Fetch and prepare assets
        run: python the-bakery/tools/fetch.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bakery/tools the-bakery/assets 2>/dev/null || git add the-bakery/tools
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Prepare The Bakery fonts, marks and photos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
