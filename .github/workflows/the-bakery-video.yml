name: The Bakery video

# Films the live The Bakery site for its Kreeative case study: Chrome's
# screencast frames (record.cjs) turned into an H.264 MP4 by ffmpeg
# (encode.cjs). The development sandbox has no H.264 encoder.
on:
  push:
    branches: ["claude/restaurant-food-ordering-app-2jft1i"]
    paths:
      - "the-bakery/tools/video/take.json"
      - "the-bakery/tools/video/record.cjs"
      - "the-bakery/tools/video/encode.cjs"

permissions:
  contents: write

concurrency:
  group: the-bakery-video
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --silent playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Record
        env:
          PW_MODULE: /tmp/pw/node_modules/playwright
        run: node the-bakery/tools/video/record.cjs "$(jq -r .url the-bakery/tools/video/take.json)" /tmp/frames

      - name: Encode
        run: node the-bakery/tools/video/encode.cjs /tmp/frames the-bakery/tools/video/out

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-bakery/tools/video/out
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Film The Bakery for its Kreeative case study"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
