  <!-- ============ 1. THE GATEFOLD COVER ============ -->
  <section class="gate" id="gate" aria-label="Your invitation">
    <div class="gate__door gate__door--l"><svg class="gate__sprig gate__sprig--t"><use href="#sprig" /></svg><svg class="gate__sprig gate__sprig--b"><use href="#sprig" /></svg></div>
    <div class="gate__door gate__door--r"><svg class="gate__sprig gate__sprig--t"><use href="#sprig" /></svg><svg class="gate__sprig gate__sprig--b"><use href="#sprig" /></svg></div>
    <div class="gate__card">
      <button class="gate__seal" id="gateSeal" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 120 120"><use href="#seal" /></svg></button>
      <svg class="crest gate__crest" aria-hidden="true"><use href="#crest" /></svg>
      <p class="caps gate__kicker" data-t="cover.kicker"></p>
      <h1 class="gate__names">
        <span class="gate__name" data-t="couple.first"></span>
        <span class="gate__amp">&amp;</span>
        <span class="gate__name" data-t="couple.second"></span>
      </h1>
      <p class="gate__line" data-t="cover.line"></p>
      <p class="caps gate__date" data-t="event.dateText"></p>
      <p class="gate__dear"><span data-t="cover.dear"></span> <span data-guest></span>,</p>
      <button class="btn btn--olive gate__open" id="gateOpen" type="button"><span data-t="cover.button"></span></button>
    </div>
  </section>

  <!-- ============ 2. NAVIGATION ============ -->
  <header class="nav" id="nav">
    <nav class="nav__inner" aria-label="Sections">
      <ul class="nav__links nav__links--l" id="navL"></ul>
      <a class="nav__crest" href="#top" aria-label="Top"><svg class="crest"><use href="#crest" /></svg></a>
      <ul class="nav__links nav__links--r" id="navR"></ul>
      <button class="nav__toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="menu"><span></span><span></span><span class="sr" data-t="menuLabel"></span></button>
    </nav>
  </header>
  <div class="menu" id="menu" hidden>
    <svg class="crest menu__crest" aria-hidden="true"><use href="#crest" /></svg>
    <ul class="menu__links" id="menuLinks"></ul>
  </div>

  <main id="top">
    <!-- ============ 3. HERO ============ -->
    <section class="hero" id="hero">
      <div class="hero__media" aria-hidden="true">
        <picture>
          <source media="(max-aspect-ratio: 4/5)" data-srcset="hero.photoTall" />
          <img class="hero__img" data-src="hero.photoWide" alt="" />
        </picture>
      </div>
      <div class="hero__fx" aria-hidden="true">
        <span class="ray ray--1"></span><span class="ray ray--2"></span><span class="ray ray--3"></span>
        <span class="mist mist--1"></span><span class="mist mist--2"></span>
        <div class="motes" id="motes"></div>
        <div class="leaves" id="leaves"></div>
      </div>
      <div class="swans" id="swans" aria-hidden="true">
        <svg class="swans__pair" viewBox="-175 -178 350 190">
          <use href="#swan" x="-160" y="-170" width="170" height="176" />
          <use href="#swan" x="-160" y="-170" width="170" height="176" transform="scale(-1 1)" />
        </svg>
        <svg class="swans__pair swans__reflection" viewBox="-175 -178 350 190">
          <use href="#swan" x="-160" y="-170" width="170" height="176" />
          <use href="#swan" x="-160" y="-170" width="170" height="176" transform="scale(-1 1)" />
        </svg>
        <span class="ripple"></span><span class="ripple ripple--2"></span>
      </div>
      <div class="hero__content">
        <p class="caps hero__kicker" data-t="hero.kicker"></p>
        <h2 class="hero__names">
          <span class="hero__name" data-t="couple.first"></span>
          <span class="hero__amp">&amp;</span>
          <span class="hero__name" data-t="couple.second"></span>
        </h2>
        <p class="caps hero__meta"><span data-t="event.dateText"></span><i></i><span data-t="event.place"></span></p>
      </div>
      <a class="hero__scroll" href="#welcome"><span class="caps" data-t="hero.scroll"></span><i></i></a>
    </section>

    <!-- ============ 4. WELCOME ============ -->
    <section class="welcome section--olive" id="welcome">
      <p class="watermark" data-t="welcome.watermark" data-parallax="-0.12" aria-hidden="true"></p>
      <div class="wrap wrap--narrow" data-reveal>
        <svg class="sprig" aria-hidden="true"><use href="#sprig" /></svg>
        <h2 class="caps welcome__title" data-t="welcome.title"></h2>
        <p class="welcome__text" data-t="welcome.text"></p>
        <p class="welcome__signoff" data-t="welcome.signoff"></p>
        <p class="script welcome__names"><span data-t="couple.first"></span> &amp; <span data-t="couple.second"></span></p>
      </div>
    </section>

    <!-- ============ 5. STORY ============ -->
    <section class="story" id="story">
      <div class="wrap">
        <header class="heading" data-reveal>
          <h2 class="caps heading__caps" data-t="story.title"></h2>
          <p class="script heading__script" data-t="story.script"></p>
        </header>
        <div class="story__grid">
          <div class="story__text" data-reveal><p data-t="story.text"></p></div>
          <div class="story__photos">
            <figure class="story__photo story__photo--1" data-reveal="wipe" data-parallax="0.06" data-photo><img data-src="story.photos.0" alt="" /></figure>
            <figure class="story__photo story__photo--2" data-reveal="wipe" data-parallax="-0.08" data-photo><img data-src="story.photos.1" alt="" /></figure>
          </div>
        </div>
        <ol class="milestones" id="milestones"></ol>
      </div>
    </section>

    <!-- ============ 6. COUNTDOWN ============ -->
    <section class="countdown section--stone" id="countdown">
      <div class="wrap" data-reveal>
        <p class="script countdown__script" data-t="countdown.script"></p>
        <h2 class="caps countdown__title" data-t="countdown.title"></h2>
        <div class="counter" id="counter">
          <div class="counter__unit"><span class="counter__n" data-cd="0">00</span><span class="caps counter__l" data-t="countdown.labels.0"></span></div>
          <div class="counter__unit"><span class="counter__n" data-cd="1">00</span><span class="caps counter__l" data-t="countdown.labels.1"></span></div>
          <div class="counter__unit"><span class="counter__n" data-cd="2">00</span><span class="caps counter__l" data-t="countdown.labels.2"></span></div>
          <div class="counter__unit"><span class="counter__n" data-cd="3">00</span><span class="caps counter__l" data-t="countdown.labels.3"></span></div>
        </div>
        <p class="countdown__after" id="countdownAfter" hidden data-t="countdown.after"></p>
        <div class="cal">
          <button class="btn btn--line" id="calBtn" type="button" aria-expanded="false" aria-controls="calMenu"><svg aria-hidden="true"><use href="#calendar" /></svg><span data-t="countdown.calendarButton"></span></button>
          <div class="cal__menu" id="calMenu" hidden>
            <a id="calGoogle" href="#" target="_blank" rel="noopener" data-t="countdown.googleLabel"></a>
            <button id="calIcs" type="button" data-t="countdown.appleLabel"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 7. VENUE ============ -->
    <section class="venue section--olive" id="venue">
      <div class="wrap venue__grid">
        <div class="venue__photo" data-reveal="tilt"><figure class="scallop" data-photo><img data-src="venue.photo" alt="" /></figure></div>
        <div class="venue__text" data-reveal>
          <p class="script venue__script" data-t="venue.script"></p>
          <h2 class="venue__name" data-t="venue.name"></h2>
          <p class="caps venue__address" data-t="venue.address"></p>
          <a class="btn btn--line btn--light" id="venueMap" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#pin" /></svg><span data-t="venue.mapLabel"></span></a>
        </div>
      </div>
    </section>

    <!-- ============ 8. DETAILS + SCHEDULE ============ -->
    <section class="details" id="details">
      <div class="wrap wrap--narrow" id="detailsList"></div>
      <div class="wrap schedule" id="schedule">
        <header class="heading" data-reveal>
          <p class="script heading__script heading__script--solo" data-t="schedule.script"></p>
          <h2 class="caps heading__caps heading__caps--small" data-t="schedule.title"></h2>
        </header>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- ============ 9. GALLERY ============ -->
    <section class="gallery section--stone" id="gallery">
      <div class="wrap">
        <header class="heading" data-reveal>
          <p class="script heading__script heading__script--solo" data-t="gallery.script"></p>
          <h2 class="caps heading__caps heading__caps--small" data-t="gallery.title"></h2>
        </header>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <!-- ============ 10. RSVP ============ -->
    <section class="rsvp" id="rsvp">
      <div class="rsvp__bg" aria-hidden="true"><img data-src="hero.photoWide" alt="" /></div>
      <div class="wrap rsvp__wrap">
        <header class="heading heading--light" data-reveal>
          <p class="script heading__script heading__script--solo" data-t="rsvp.script"></p>
          <h2 class="caps heading__caps heading__caps--small" data-t="rsvp.deadline"></h2>
        </header>

        <button class="envelope" id="envelope" type="button" data-reveal>
          <span class="envelope__back"></span>
          <span class="envelope__card">
            <svg class="crest envelope__crest" aria-hidden="true"><use href="#crest" /></svg>
            <span class="script envelope__card-title" data-t="rsvp.script"></span>
          </span>
          <span class="envelope__front"></span>
          <span class="envelope__flap"></span>
          <span class="envelope__seal"><svg viewBox="0 0 120 120"><use href="#seal" /></svg></span>
          <span class="caps envelope__hint" data-t="rsvp.envelopeHint"></span>
        </button>

        <div class="card" id="rsvpCard" hidden>
          <span class="card__corner card__corner--tl"></span><span class="card__corner card__corner--tr"></span>
          <span class="card__corner card__corner--bl"></span><span class="card__corner card__corner--br"></span>
          <form class="form" id="rsvpForm" novalidate>
            <svg class="crest form__crest" aria-hidden="true"><use href="#crest" /></svg>
            <h3 class="caps form__title" data-t="rsvp.title"></h3>
            <label class="field">
              <span class="caps field__label" data-t="rsvp.labels.name"></span>
              <input class="field__input" name="name" autocomplete="name" required data-ph="rsvp.labels.namePlaceholder" />
            </label>
            <label class="field">
              <span class="caps field__label" data-t="rsvp.labels.email"></span>
              <input class="field__input" name="email" type="email" autocomplete="email" data-ph="rsvp.labels.emailPlaceholder" />
            </label>
            <fieldset class="field choice">
              <legend class="caps field__label" data-t="rsvp.labels.attending"></legend>
              <div class="choice__row">
                <label class="choice__opt"><input type="radio" name="attending" value="yes" required /><span data-t="rsvp.labels.yes"></span></label>
                <label class="choice__opt"><input type="radio" name="attending" value="no" /><span data-t="rsvp.labels.no"></span></label>
              </div>
            </fieldset>
            <div class="form__more"><div class="form__more-inner">
              <label class="field" id="guestsField">
                <span class="caps field__label" data-t="rsvp.labels.guests"></span>
                <select class="field__input" name="guests" id="guestsSelect"></select>
              </label>
              <label class="field">
                <span class="caps field__label" data-t="rsvp.labels.diet"></span>
                <input class="field__input" name="diet" data-ph="rsvp.labels.dietPlaceholder" />
              </label>
              <label class="field">
                <span class="caps field__label" data-t="rsvp.labels.song"></span>
                <input class="field__input" name="song" data-ph="rsvp.labels.songPlaceholder" />
              </label>
            </div></div>
            <label class="field">
              <span class="caps field__label" data-t="rsvp.labels.message"></span>
              <textarea class="field__input" name="message" rows="3" data-ph="rsvp.labels.messagePlaceholder"></textarea>
            </label>
            <p class="form__error" id="rsvpError" role="alert" hidden></p>
            <button class="btn btn--olive form__submit" id="rsvpSubmit" type="submit"><span data-t="rsvp.labels.submit"></span></button>
          </form>
          <div class="thanks" id="thanks" hidden>
            <svg class="thanks__seal" viewBox="0 0 120 120" aria-hidden="true"><use href="#seal" /></svg>
            <h3 class="script thanks__title" id="thanksTitle" tabindex="-1"></h3>
            <p class="thanks__text" id="thanksText"></p>
            <p class="caps thanks__note" id="thanksNote"></p>
            <button class="btn btn--line" id="rsvpAgain" type="button" data-t="rsvp.labels.again"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 11. FAQ ============ -->
    <section class="faq" id="faq">
      <div class="wrap wrap--narrow">
        <header class="heading" data-reveal>
          <p class="script heading__script heading__script--solo" data-t="faq.script"></p>
          <h2 class="caps heading__caps heading__caps--small" data-t="faq.title"></h2>
        </header>
        <div class="accordion" id="accordion"></div>
      </div>
    </section>
  </main>

  <!-- ============ 12. FOOTER ============ -->
  <footer class="foot section--olive">
    <svg class="crest foot__crest" aria-hidden="true"><use href="#crest" /></svg>
    <p class="script foot__names"><span data-t="couple.first"></span> &amp; <span data-t="couple.second"></span></p>
    <p class="caps foot__date" data-t="footer.date"></p>
    <p class="foot__tag" data-t="footer.hashtag"></p>
    <p class="foot__credit" id="credit" hidden><a target="_blank" rel="noopener"></a></p>
  </footer>

  <a class="chip caps" id="rsvpChip" href="#rsvp" data-t="rsvpChip"></a>
  <button class="music" id="musicBtn" type="button" hidden aria-pressed="false"><svg aria-hidden="true"><use href="#note" /></svg><span class="music__bars"><i></i><i></i><i></i></span></button>
  <audio id="music" loop preload="none"></audio>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
    <button class="lightbox__btn lightbox__close" type="button" data-lb="close"><svg aria-hidden="true"><use href="#close" /></svg></button>
    <button class="lightbox__btn lightbox__prev" type="button" data-lb="prev"><svg aria-hidden="true"><use href="#chev" /></svg></button>
    <figure class="lightbox__fig"><img alt="" /><figcaption></figcaption></figure>
    <button class="lightbox__btn lightbox__next" type="button" data-lb="next"><svg aria-hidden="true"><use href="#chev" /></svg></button>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</body>
</html>
