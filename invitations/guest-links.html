<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Guest Links</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f6f1e8; --paper: #fffdf9; --ink: #1f1b18; --soft: #6a625b; --line: rgba(31, 27, 24, .15); --accent: #4b0a0f; --ok: #3d4430;
      --serif: "Cormorant Garamond", Garamond, Georgia, serif; --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 400 18px/1.6 var(--serif); -webkit-font-smoothing: antialiased; }
    main { width: min(900px, 100% - 32px); margin: 0 auto; padding: 56px 0 80px; }
    a { color: inherit; }
    .back { font: 600 10.5px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; text-decoration: none; color: var(--soft); }
    h1 { margin-top: 18px; font: 400 clamp(38px, 6vw, 56px)/1.05 var(--serif); }
    .intro { margin-top: 10px; max-width: 38em; color: var(--soft); }
    .panel { margin-top: 30px; padding: clamp(20px, 4vw, 34px); background: var(--paper); border: 1px solid var(--line); border-radius: 20px; display: grid; gap: 20px; }
    label { display: grid; gap: 8px; }
    label span { font: 600 10.5px/1.3 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); }
    input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: 400 18px/1.45 var(--serif); color: var(--ink); }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid rgba(75, 10, 15, .35); outline-offset: 1px; }
    small { font-size: 15px; color: var(--soft); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 12px 20px; border: 1px solid var(--ink); border-radius: 999px; background: none; font: 600 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; color: var(--ink); cursor: pointer; }
    button.solid { background: var(--ink); color: var(--bg); }
    .results { margin-top: 30px; display: grid; gap: 10px; }
    .result { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; padding: 16px 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
    .result b { font: 500 21px/1.2 var(--serif); }
    .result code { grid-column: 1 / -1; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); word-break: break-all; }
    .result .row { grid-row: 1; grid-column: 2; }
    .result button, .result .btn { min-height: 36px; padding: 9px 14px; }
    .copied { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; }
    .empty { color: var(--soft); font-style: italic; }
    @media (max-width: 560px) { .result { grid-template-columns: 1fr; } .result .row { grid-row: auto; grid-column: 1; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="./">← All designs</a>
    <h1>Personal guest links</h1>
    <p class="intro">Paste your guest list — one invitation per line — and get a personal link for each one. The envelope greets them by name. Nothing is uploaded: everything stays in this browser.</p>

    <div class="panel">
      <label><span>Your invitation link</span>
        <input id="base" type="url" placeholder="https://your-site.com/bordeaux/" />
        <small>The address of your published invitation.</small>
      </label>
      <label><span>Guests (one per line)</span>
        <textarea id="names" placeholder="Sophie & Tom&#10;Grandma Rose&#10;The Martin family"></textarea>
      </label>
      <label><span>WhatsApp message</span>
        <textarea id="message" style="min-height: 96px">Dear {name}, we would love for you to celebrate our wedding with us! Your invitation: {link}</textarea>
        <small>{name} and {link} are replaced for each guest.</small>
      </label>
      <div class="row">
        <button class="solid" id="make" type="button">Create links</button>
        <button id="copyAll" type="button" hidden>Copy all</button>
        <button id="csv" type="button" hidden>Download CSV</button>
      </div>
    </div>

    <div class="results" id="results" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const base = $("base"), names = $("names"), message = $("message"), results = $("results");
      let rows = [];

      // Remember what was typed (only in this browser)
      const KEY = "guest-links";
      try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); if (s.base) base.value = s.base; if (s.names) names.value = s.names; if (s.message) message.value = s.message; } catch (e) {}
      if (!base.value) base.value = new URL("bordeaux/", location.href).href;
      const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ base: base.value, names: names.value, message: message.value })); } catch (e) {} };

      const linkFor = (name) => {
        const url = base.value.trim();
        const [path, hash] = url.split("#");
        return path + (path.includes("?") ? "&" : "?") + "to=" + encodeURIComponent(name) + (hash ? "#" + hash : "");
      };
      const flash = (btn, text) => {
        const old = btn.textContent;
        btn.textContent = text; btn.classList.add("copied");
        setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
      };
      const copy = async (text, btn) => {
        try { await navigator.clipboard.writeText(text); }
        catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
        flash(btn, "Copied");
      };

      function make() {
        save();
        results.textContent = "";
        rows = names.value.split("\n").map((n) => n.trim()).filter(Boolean).map((name) => ({ name, link: linkFor(name) }));
        $("copyAll").hidden = $("csv").hidden = !rows.length;
        if (!base.value.trim()) { results.innerHTML = '<p class="empty">Add your invitation link first.</p>'; return; }
        if (!rows.length) { results.innerHTML = '<p class="empty">Add at least one guest.</p>'; return; }
        rows.forEach((r) => {
          const card = document.createElement("div");
          card.className = "result";
          const b = document.createElement("b"); b.textContent = r.name;
          const code = document.createElement("code"); code.textContent = r.link;
          const actions = document.createElement("div"); actions.className = "row";
          const c = document.createElement("button"); c.type = "button"; c.textContent = "Copy";
          c.addEventListener("click", () => copy(r.link, c));
          const w = document.createElement("a"); w.className = "btn"; w.target = "_blank"; w.rel = "noopener"; w.textContent = "WhatsApp";
          w.href = "https://wa.me/?text=" + encodeURIComponent(message.value.replace(/\{name\}/g, r.name).replace(/\{link\}/g, r.link));
          const o = document.createElement("a"); o.className = "btn"; o.target = "_blank"; o.rel = "noopener"; o.textContent = "Open"; o.href = r.link;
          actions.append(c, w, o);
          card.append(b, actions, code);
          results.appendChild(card);
        });
      }

      $("make").addEventListener("click", make);
      $("copyAll").addEventListener("click", (e) => copy(rows.map((r) => r.name + ": " + r.link).join("\n"), e.currentTarget));
      $("csv").addEventListener("click", () => {
        const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
        const csv = "name,link\n" + rows.map((r) => q(r.name) + "," + q(r.link)).join("\n");
        const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
        const a = document.createElement("a"); a.href = url; a.download = "guest-links.csv"; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      });
    })();
  </script>
</body>
</html>
