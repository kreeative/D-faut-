  <!-- ============ 1. THE ENVELOPE ============ -->
  <section class="intro" id="intro" aria-label="Your invitation">
    <div class="intro__inner">
      <p class="intro__kicker" data-t="envelope.kicker"></p>
      <p class="intro__names" data-t="couple.names"></p>

      <div class="envelope" id="envelope">
        <div class="envelope__back"></div>
        <div class="envelope__letter">
          <p class="letter__kicker" data-t="envelope.letterTitle"></p>
          <p class="letter__names" data-t="couple.names"></p>
          <p class="letter__text" data-t="envelope.letterText"></p>
          <p class="letter__date" data-t="event.dateText"></p>
        </div>
        <div class="envelope__pocket">
          <div class="stamp envelope__stamp"><span class="stamp__inner"><svg class="stamp__heart"><use href="#heart" /></svg><span data-t="envelope.stampText"></span></span></div>
          <p class="envelope__address">
            <span class="envelope__to" data-t="envelope.toLabel"></span>
            <span class="envelope__guest" data-guest></span>
          </p>
        </div>
        <div class="envelope__flap"><span class="flap__face flap__face--out"></span><span class="flap__face flap__face--in"></span></div>
        <button class="seal-btn" id="sealBtn" type="button" aria-label="Open the invitation">
          <span class="seal-btn__ring"></span>
          <svg class="seal-btn__half seal-btn__half--l" viewBox="0 0 120 120"><use href="#seal" /></svg>
          <svg class="seal-btn__half seal-btn__half--r" viewBox="0 0 120 120"><use href="#seal" /></svg>
        </button>
      </div>

      <p class="intro__hint" data-t="envelope.hint"></p>
      <p class="intro__date" data-t="event.dateText"></p>
    </div>
  </section>

  <main class="book" id="top">
    <!-- ============ 2. MAIN CARD ============ -->
    <article class="hero" id="home">
      <svg class="bow" viewBox="0 0 240 230" aria-hidden="true">
        <g class="bow__all">
          <path class="twine" d="M-6 36C44 40 102 56 150 70" />
          <g class="bow__tails">
            <path class="twine" d="M150 70c-8 26 2 46-2 70s-10 44 2 64" />
            <path class="twine" d="M150 70c12 24 30 38 38 60 5 13 6 26 12 40" />

          <path class="twine" d="M150 70c-30-30-62-48-74-36-14 14 20 40 74 36z" />

          <ellipse cx="148" cy="68" rx="3.5" ry="2.2" fill="#e8cc9a" opacity=".7" />
        </g>
      </svg>

      <div class="hero__top">
        <nav class="hero__nav" aria-label="Sections">
          <a href="#story" data-t="hero.nav.0"></a>
          <a href="#details" data-t="hero.nav.1"></a>
          <a href="#rsvp" data-t="hero.nav.2"></a>
        </nav>
        <h1 class="title">
          <span class="title__kicker" data-t="hero.kicker"></span>
          <span class="title__script" data-t="hero.script"></span>
          <span class="title__overlay" data-t="hero.overlay"></span>
        </h1>
        <p class="hero__subline" data-t="hero.subline"></p>
        <p class="pill"><span data-t="hero.datePill.0"></span><i></i><span data-t="hero.datePill.1"></span></p>
      </div>

      <div class="collage">
        <figure class="print-photo strip strip--a" data-photo><img data-src="hero.photos.stripTop" alt="" /></figure>
        <figure class="print-photo strip strip--b" data-photo><img data-src="hero.photos.stripBottom" alt="" /></figure>
        <svg class="collage__seal" viewBox="0 0 120 120" aria-hidden="true"><use href="#seal" /></svg>
        <p class="lyrics" data-lines="hero.lyrics" aria-hidden="true"></p>
        <div class="note-wrap">
          <div class="note"><p data-t="hero.note"></p></div>
          <svg class="note__tack" viewBox="0 0 40 40" aria-hidden="true"><use href="#tack" /></svg>
        </div>
        <figure class="snap snap--l" data-photo><img data-src="hero.photos.left" alt="" /></figure>
        <figure class="snap snap--r" data-photo><img data-src="hero.photos.right" alt="" /></figure>

        <svg class="rings" viewBox="0 0 170 110" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

              <radialGradient id="lens" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6c6fa0" /><stop offset=".35" stop-color="#26264a" /><stop offset="1" stop-color="#050510" /></radialGradient>
              <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f4" /><stop offset=".5" stop-color="#9a9a9e" /><stop offset="1" stop-color="#e6e6e8" /></linearGradient>

            <circle cx="160" cy="116" r="8" fill="#c7372f" />

          </svg>
          <span class="camera__hint" data-t="hero.cameraHint"></span>
        </button>

        <p class="nametag" data-t="hero.nameTag"></p>
        <p class="location"><svg aria-hidden="true"><use href="#mappin" /></svg><b data-t="hero.locationLabel"></b>&nbsp;<span data-t="hero.location"></span></p>
      </div>
    </article>

    <!-- ============ 3. COUNTDOWN TICKET ============ -->
    <section class="ticket" id="countdown" data-reveal="rise">
      <div class="ticket__main">
        <h2 class="script-title script-title--cream" data-t="countdown.title"></h2>
        <p class="ticket__sub" data-t="countdown.subtitle"></p>
        <div class="countdown" id="countdownGrid">
          <div class="cd"><span class="cd__n" data-cd="0">00</span><span class="cd__l" data-t="countdown.labels.0"></span></div>
          <div class="cd"><span class="cd__n" data-cd="1">00</span><span class="cd__l" data-t="countdown.labels.1"></span></div>
          <div class="cd"><span class="cd__n" data-cd="2">00</span><span class="cd__l" data-t="countdown.labels.2"></span></div>
          <div class="cd"><span class="cd__n" data-cd="3">00</span><span class="cd__l" data-t="countdown.labels.3"></span></div>
        </div>
        <p class="countdown__after" id="countdownAfter" hidden data-t="countdown.after"></p>
        <div class="cal">
          <button class="btn btn--cream" id="calBtn" type="button" aria-expanded="false" aria-controls="calMenu">
            <svg aria-hidden="true"><use href="#calendar" /></svg><span data-t="countdown.calendarButton"></span>
          </button>
          <div class="cal__menu" id="calMenu" hidden>
            <a id="calGoogle" href="#" target="_blank" rel="noopener" data-t="countdown.googleLabel"></a>
            <button id="calIcs" type="button" data-t="countdown.appleLabel"></button>
          </div>
        </div>
      </div>
      <div class="ticket__stub" aria-hidden="true">
        <span class="stub__admit" data-t="countdown.admit"></span>
        <svg class="stub__heart"><use href="#heart" /></svg>
        <span class="stub__date" data-t="footer.date"></span>
      </div>
    </section>

    <!-- ============ 4. OUR STORY ============ -->
    <section class="paper story" id="story">
      <h2 class="script-title" data-t="story.title" data-reveal="fade"></h2>
      <p class="lead" data-t="story.intro" data-reveal="fade"></p>
      <ol class="chapters" id="chapters"></ol>
      <template id="tplChapter">
        <li class="chapter" data-reveal="drop">
          <figure class="polaroid" data-photo><span class="tape"></span><img alt="" /><figcaption></figcaption></figure>
          <div class="chapter__text">
            <p class="chapter__date"></p>
            <h3 class="chapter__title"></h3>
            <p class="chapter__body"></p>
          </div>
        </li>
      </template>
    </section>

    <!-- ============ 5. DETAILS (hanging tags + dress code) ============ -->
    <section class="details" id="details">
      <h2 class="script-title script-title--cream" data-t="details.title" data-reveal="fade"></h2>
      <div class="tags" id="tags">
        <svg class="tags__line" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path class="twine" d="M-10 8C120 34 280 34 410 8" /></svg>
      </div>
      <template id="tplTag">
        <article class="tag" data-reveal="swing">
          <span class="tag__string"></span>
          <div class="tag__card">
            <span class="tag__hole"></span>
            <h3 class="tag__label"></h3>
            <p class="tag__time"></p>
            <p class="tag__place"></p>
            <p class="tag__address"></p>
            <a class="tag__map" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#mappin" /></svg><span></span></a>
          </div>
        </article>
      </template>

      <div class="paper dress" data-reveal="rise">
        <h3 class="script-title" data-t="dressCode.title"></h3>
        <p class="dress__text" data-t="dressCode.text"></p>
        <ul class="chips" id="chips"></ul>
      </div>
    </section>

    <!-- ============ 6. ORDER OF THE DAY ============ -->
    <section class="notepad" id="schedule" data-reveal="rise">
      <h2 class="script-title" data-t="schedule.title"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- ============ 7. GOOD TO KNOW ============ -->
    <section class="notes" id="notes">
      <h2 class="script-title script-title--cream" data-t="notes.title" data-reveal="fade"></h2>
      <div class="notes__grid" id="notesGrid"></div>
    </section>

    <!-- ============ 8. GALLERY FILM STRIP ============ -->
    <section class="film" id="gallery">
      <h2 class="script-title script-title--cream" data-t="gallery.title" data-reveal="fade"></h2>
      <div class="film__strip" data-reveal="fade"><div class="film__track" id="filmTrack"></div></div>
    </section>

    <!-- ============ 9. RSVP POSTCARD ============ -->
    <section class="rsvp-wrap" id="rsvp">
      <div class="postcard" id="postcard" data-reveal="rise">
        <div class="postcard__head">
          <div>
            <h2 class="script-title" data-t="rsvp.title"></h2>
            <p class="postcard__deadline" data-t="rsvp.deadline"></p>
          </div>
          <div class="postcard__stamps" aria-hidden="true">
            <div class="stamp"><span class="stamp__inner"><svg class="stamp__heart"><use href="#heart" /></svg><span data-t="envelope.stampText"></span></span></div>
            <svg class="postmark" viewBox="0 0 120 120">
              <defs><path id="pmCircle" d="M60 60m-40 0a40 40 0 1 1 80 0a40 40 0 1 1-80 0" /></defs>
              <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="60" cy="60" r="30" fill="none" stroke="currentColor" stroke-width="1.4" />
              <text font-size="11.5" letter-spacing="2" fill="currentColor"><textPath href="#pmCircle" id="postmarkText">BORDEAUX · 2027 ·</textPath></text>
              <path d="M112 44c-8 5-16-5-24 0M112 60c-8 5-16-5-24 0M112 76c-8 5-16-5-24 0" fill="none" stroke="currentColor" stroke-width="2" transform="translate(30 0)" />
              <path d="M46 60l8 8 16-18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <form class="rsvp" id="rsvpForm" novalidate>
          <label class="field">
            <span class="field__label" data-t="rsvp.labels.name"></span>
            <input class="field__input" name="name" autocomplete="name" required data-ph="rsvp.labels.namePlaceholder" />
          </label>
          <fieldset class="choice">
            <legend class="field__label" data-t="rsvp.labels.attending"></legend>
            <label class="choice__opt"><input type="radio" name="attending" value="yes" required /><span class="choice__box"><svg><use href="#heart" /></svg></span><span data-t="rsvp.labels.yes"></span></label>
            <label class="choice__opt"><input type="radio" name="attending" value="no" /><span class="choice__box"><svg><use href="#heart" /></svg></span><span data-t="rsvp.labels.no"></span></label>
          </fieldset>
          <div class="rsvp__more" id="rsvpMore"><div class="rsvp__more-inner">
            <div class="field">
              <span class="field__label" id="guestsLabel" data-t="rsvp.labels.guests"></span>
              <div class="stepper" role="group" aria-labelledby="guestsLabel">
                <button type="button" data-step="-1" aria-label="−1">−</button>
                <output id="guestsOut" aria-live="polite">1</output>
                <button type="button" data-step="1" aria-label="+1">+</button>
              </div>
              <input type="hidden" name="guests" id="guestsInput" value="1" />
            </div>
            <label class="field">
              <span class="field__label" data-t="rsvp.labels.diet"></span>
              <input class="field__input" name="diet" data-ph="rsvp.labels.dietPlaceholder" />
            </label>
            <label class="field">
              <span class="field__label" data-t="rsvp.labels.song"></span>
              <input class="field__input" name="song" data-ph="rsvp.labels.songPlaceholder" />
            </label>
          </div></div>
          <label class="field">
            <span class="field__label" data-t="rsvp.labels.message"></span>
            <textarea class="field__input" name="message" rows="3" data-ph="rsvp.labels.messagePlaceholder"></textarea>
          </label>
          <p class="rsvp__error" id="rsvpError" role="alert" hidden></p>
          <button class="btn btn--wine" id="rsvpSubmit" type="submit"><span data-t="rsvp.labels.submit"></span><svg aria-hidden="true"><use href="#heart" /></svg></button>
        </form>

        <div class="thanks" id="thanks" hidden>
          <svg class="thanks__seal" viewBox="0 0 120 120" aria-hidden="true"><use href="#seal" /></svg>
          <h3 class="script-title" id="thanksTitle" tabindex="-1"></h3>
          <p class="thanks__text" id="thanksText"></p>
          <p class="thanks__note" id="thanksNote"></p>
          <button class="btn btn--ghost" id="rsvpAgain" type="button" data-t="rsvp.labels.again"></button>
        </div>
      </div>
    </section>

    <!-- ============ 10. FOOTER ============ -->
    <footer class="foot" data-reveal="fade">
      <svg class="foot__seal" viewBox="0 0 120 120" aria-hidden="true"><use href="#seal" /></svg>
      <p class="foot__kicker" data-t="footer.kicker"></p>
      <p class="foot__names" data-t="couple.names"></p>
      <p class="foot__date" data-t="footer.date"></p>
      <p class="foot__tag" data-t="footer.hashtag"></p>
      <p class="foot__credit" id="credit" hidden><a target="_blank" rel="noopener"></a></p>
    </footer>
  </main>

  <a class="chip" id="rsvpChip" href="#rsvp"><svg aria-hidden="true"><use href="#heart" /></svg><span data-t="rsvpChip"></span></a>
  <button class="music" id="musicBtn" type="button" hidden aria-pressed="false"><svg aria-hidden="true"><use href="#vinyl" /></svg></button>
  <audio id="music" loop preload="none"></audio>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
    <button class="lightbox__btn lightbox__close" type="button" data-lb="close"><svg aria-hidden="true"><use href="#close" /></svg></button>
    <button class="lightbox__btn lightbox__prev" type="button" data-lb="prev"><svg aria-hidden="true"><use href="#chev" /></svg></button>
    <figure class="lightbox__fig"><img alt="" /><figcaption></figcaption></figure>
    <button class="lightbox__btn lightbox__next" type="button" data-lb="next"><svg aria-hidden="true"><use href="#chev" /></svg></button>
  </div>

  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</body>
</html>
