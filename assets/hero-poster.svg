<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="68%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2f36"/>
      <stop offset="45%" stop-color="#14171b"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7d3a1"/>
      <stop offset="100%" stop-color="#c8a45c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- abstract road / horizon lines -->
  <g stroke="url(#gold)" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M0 760 L1920 520"/>
    <path d="M0 880 L1920 620"/>
    <path d="M0 1010 L1920 740"/>
  </g>

  <!-- light streak -->
  <rect x="0" y="380" width="1920" height="240" fill="url(#sheen)" transform="skewY(-6 0 500)"/>

  <!-- faint wordmark -->
  <text x="960" y="600" text-anchor="middle"
        font-family="Archivo, Arial, sans-serif" font-weight="900"
        font-size="220" letter-spacing="40"
        fill="#ffffff" fill-opacity="0.04">VANTÉ</text>
</svg>
